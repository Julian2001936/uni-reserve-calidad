spring.application.name=unireserve-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/unireserve}
spring.datasource.username=${DB_USER:unireserve}
spring.datasource.password=${DB_PASSWORD:unireserve}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET:UniReserveSuperSecretKeyChangeThisInProduction2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
